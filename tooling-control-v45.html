<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tooling Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  /* Identidad de la plataforma */
  --navy:#1B3A66; --orange:#CC5500;
  --green:#2F8F5B; --blue:#2A6DB0; --amber:#C98A12; --red:#C23B2E; --gray:#6B7785;
  --ink:#1C2530; --ink-2:#5B6775; --bg:#EEF1F5; --card:#FFFFFF; --soft:#E6EBF1;
  --shadow:0 1px 4px rgba(28,37,48,.08);
  --shadow-up:0 -6px 24px rgba(28,37,48,.18);
  --sheet-h:min(46vh,440px);
  --steel-hi:#F5F7F9; --steel-mid:#CBD2D9; --steel-lo:#98A3AF;
  --f-head:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body)}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:600;color:var(--navy);letter-spacing:.005em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
svg :focus-visible{outline:none}
.st-ok{--st:var(--green);--on-st:#fff}
.st-atencion{--st:var(--amber);--on-st:var(--ink)}
.st-reemplazar,.st-faltante{--st:var(--red);--on-st:#fff}
.st-pedido{--st:var(--blue);--on-st:#fff}

/* ---------- encabezado ---------- */
.top{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:10px 22px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(28,37,48,.25)}
.brand{display:flex;flex-direction:column;background:none;border:0;padding:2px 4px;text-align:left;color:#fff}
.brand b{font:600 27px/1 var(--f-head);letter-spacing:.01em}
.brand small{font-size:12.5px;opacity:.8}
.top .tools{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.anon .tools,.anon .search{display:none}
.search{position:relative;flex:1 1 230px;max-width:400px;margin-left:24px}
.search input{width:100%;height:40px;padding:0 12px;border:0;border-radius:8px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.results{position:absolute;left:0;right:0;top:46px;background:var(--card);border-radius:10px;box-shadow:0 6px 24px rgba(28,37,48,.22);max-height:360px;overflow:auto;color:var(--ink)}
.results button{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;width:100%;text-align:left;padding:10px 14px;background:none;border:0;border-bottom:1px solid var(--soft)}
.results button:hover{background:var(--bg)}
.results small{grid-column:2;color:var(--ink-2)}
.results .none{padding:12px 14px;color:var(--ink-2)}
.hbtn{min-height:40px;padding:6px 14px;border:0;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.hbtn:hover{background:rgba(255,255,255,.22)}
.hbadge{min-width:22px;padding:0 6px;border-radius:11px;background:#fff;color:var(--navy);font-size:13px;font-weight:700;line-height:22px;text-align:center}
.who{font-size:13.5px;line-height:1.2;text-align:right}
.who b{display:block;font-weight:600}

/* ---------- base de componentes ---------- */
.wrap{max-width:1880px;margin:0 auto;padding:20px 28px 56px}
.card{background:var(--card);border-radius:10px;box-shadow:var(--shadow)}
.code{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2)}
.small{font-size:13.5px;color:var(--ink-2)}
.hint{color:var(--ink-2);font-size:14px;margin:0 0 10px}
.link{background:none;border:0;padding:0;color:var(--navy);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btn{min-height:42px;padding:8px 16px;border:0;border-radius:8px;background:var(--card);color:var(--navy);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 0 0 1.5px var(--navy),var(--shadow)}
.btn:hover{background:#F3F6FA}
.btn.primary{background:var(--orange);color:#fff;box-shadow:0 1px 4px rgba(204,85,0,.35)}
.btn.primary:hover{background:#B34A00}
.btn.sm{min-height:34px;padding:4px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:18px 0 0}
.hd h1{font-size:40px;line-height:1.05}
.hd p{margin:6px 0 0;color:var(--ink-2);max-width:64ch}
.crumbs{display:flex;gap:8px;align-items:center;margin-top:18px;color:var(--ink-2)}
.banner{background:#FBF1DC;border-radius:10px;box-shadow:var(--shadow);padding:10px 14px;margin-bottom:14px;border-left:5px solid var(--amber)}
.dot{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--st);color:var(--on-st);font:700 12px/1 var(--f-body);flex:none}
.pill{display:inline-flex;align-items:center;gap:7px;padding:2px 12px 2px 4px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--st,var(--gray));font-weight:600;font-size:13.5px;white-space:nowrap}
.pill.plain{padding-left:12px}

/* ---------- avisos ---------- */
.notif{padding:10px 16px;margin-top:16px}
.notif-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cnt{min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--gray);color:#fff;font:700 17px/30px var(--f-head);text-align:center}
.cnt.on{background:var(--amber);color:var(--ink)}
.notif-main{flex:1 1 260px;display:flex;flex-direction:column;min-width:0}
.notif .msg{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink)}
.notif .msg:hover{text-decoration:underline}
.notif time,.alist time{font-size:13px;color:var(--ink-2)}
.notif .none{color:var(--ink-2)}
.alist{list-style:none;margin:10px 0 0;padding:6px 0 0;border-top:1px solid var(--soft)}
.alist li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--soft)}
.alist li time{grid-column:1}
.alist li .btn{grid-row:1/3;grid-column:2}

/* ---------- resumen y layout ---------- */
.tally{display:flex;flex-wrap:wrap;gap:8px 30px;margin:18px 0 14px}
.tally div{display:flex;align-items:baseline;gap:8px}
.tally b{font:600 34px/1 var(--f-head);color:var(--st,var(--navy))}
.tally span{color:var(--ink-2)}
.canvas{overflow-x:auto}
.plan,.exp{display:block;width:100%;height:auto;background-color:#F8FAFC;background-image:linear-gradient(#E1E7EE 1px,transparent 1px),linear-gradient(90deg,#E1E7EE 1px,transparent 1px);background-size:24px 24px}
.plan{min-width:900px}
.plan.wide{max-width:none;min-width:0}
.legend{position:sticky;left:0}
.minimap{padding:12px 16px;margin:0 0 12px}
.mm-row{display:flex;align-items:center;gap:8px}
.mm-strip{position:relative;flex:1;min-width:0;display:grid;gap:3px;padding:7px 5px;background:var(--bg);border-radius:8px;overflow-x:auto}
.mm-tile{min-width:26px;height:42px;padding:4px 0 0;border:0;border-radius:5px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;font:600 15px var(--f-head);color:var(--ink)}
.mm-tile i{display:block;width:100%;height:6px;background:var(--st,var(--green))}
.mm-tile:hover{box-shadow:0 2px 8px rgba(28,37,48,.22)}
.mm-win{position:absolute;top:3px;bottom:3px;border:3px solid var(--navy);border-radius:8px;pointer-events:none;transition:left .15s,width .15s}
.mm-info{display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
.mm-name{font-weight:600;font-size:14.5px}
@media (prefers-reduced-motion:reduce){.mm-win{transition:none}}.exp{min-width:780px}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;padding:12px 16px;color:var(--ink-2);font-size:14px;border-top:1px solid var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:8px}

/* ---------- dibujo SVG ---------- */
.body{fill:url(#steel);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.edge{fill:none;stroke:var(--ink);stroke-width:1.2}
.hid{fill:none;stroke:var(--ink-2);stroke-width:1;stroke-dasharray:5 4}
.hole{fill:#fff;stroke:var(--ink);stroke-width:1.4}
.strip{fill:var(--steel-mid);stroke:var(--ink-2);stroke-width:1}
.hit{fill:transparent}
.frame{fill:#fff;stroke:none;filter:drop-shadow(0 1px 4px rgba(28,37,48,.16))}
.sec{cursor:pointer}
.sec.st-atencion .frame,.sec.st-reemplazar .frame,.sec.st-faltante .frame{stroke:var(--st);stroke-width:3}
.sec:hover .frame,.sec:focus-visible .frame{stroke:var(--navy);stroke-width:4}
.sid{font:600 19px var(--f-head);fill:var(--ink-2)}
.sname{font:600 25px var(--f-head);fill:var(--navy)}
.smeta{font:400 15px var(--f-body);fill:var(--ink-2)}
.sline{font:500 15px var(--f-body);fill:var(--ink)}
.sdot{fill:var(--st)}
.sbadge{fill:var(--st)}
.sbadge-t{font:700 15px var(--f-body);fill:var(--on-st);text-anchor:middle}
.flow{font:500 14px var(--f-body);fill:var(--ink-2)}
.ghostbox{fill:none;stroke:var(--red);stroke-width:2;stroke-dasharray:6 4}
.ghostq{font:700 16px var(--f-body);fill:var(--red);text-anchor:middle}
.cl{fill:none;stroke:var(--ink-2);stroke-width:1;stroke-dasharray:18 4 3 4;pointer-events:none}
.part{cursor:pointer}
.part:not(.st-ok) .body{stroke:var(--st);stroke-width:2.6}
.part.missing .body{fill:var(--st);fill-opacity:.1;stroke-dasharray:8 5}
.part.missing .edge,.part.missing .hid{stroke:var(--red);opacity:.8}
.part:hover .body,.part:focus-visible .body{stroke:var(--navy);stroke-width:3.4}
.part.sel .body{stroke:var(--navy);stroke-width:3.8;filter:drop-shadow(0 0 5px rgba(27,58,102,.7))}
.lead{fill:none;stroke:var(--ink-2);stroke-width:1}
.leadDot{fill:var(--ink)}
.bal{cursor:pointer}
.bc{fill:#fff;stroke:var(--st);stroke-width:2.6}
.bn{font:600 18px var(--f-head);fill:var(--ink);text-anchor:middle}
.bb{fill:var(--st)}
.bg{font:700 11px var(--f-body);fill:var(--on-st);text-anchor:middle}
.bal.sel .bc{fill:var(--navy);stroke:var(--navy)}
.bal.sel .bn{fill:#fff}
.nf{fill:var(--navy)}
.nt{font:700 12px var(--f-body);fill:#fff;text-anchor:middle}
.lbl{font:500 15px var(--f-body);fill:var(--ink);text-anchor:middle}
.lbl.ped{fill:var(--blue);font-weight:700}
.tb{fill:#fff;stroke:var(--ink-2);stroke-width:1}
.tbt{font:600 16px var(--f-head);fill:var(--navy)}
.tbs{font:400 12.5px var(--f-body);fill:var(--ink-2)}

/* ---------- pestañas de sección ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;margin:16px 0 14px;padding:2px 2px 6px}
.tab{padding:8px 16px;border:0;border-radius:8px;background:var(--card);box-shadow:var(--shadow);font-weight:600;white-space:nowrap;color:var(--navy)}
.tab.on{background:var(--navy);color:#fff}
.tab .n{margin-left:6px;font-family:var(--f-head);font-size:16px}

/* ---------- hoja inferior ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;height:var(--sheet-h);background:var(--card);border-radius:14px 14px 0 0;box-shadow:var(--shadow-up);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .26s ease,visibility 0s .26s}
.sheet.open{transform:none;visibility:visible;transition:transform .26s ease}
.sheet.tall{height:92vh;z-index:50}
.grip{width:44px;height:4px;border-radius:2px;background:var(--soft);margin:8px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;gap:14px;padding:8px 24px 6px;max-width:1100px;width:100%;margin:0 auto;flex:none}
.sheet-h h2{font-size:29px;line-height:1.05}
.sheet-h h2:focus{outline:none}
.sheet-h .sp{flex:1}
.num{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--st,var(--gray));display:grid;place-items:center;font:600 20px var(--f-head);flex:none}
.xbtn{width:40px;height:40px;border:0;border-radius:50%;background:var(--bg);font-size:22px;line-height:1;color:var(--navy)}
.xbtn:hover{background:var(--soft)}
.stabs{display:flex;gap:4px;padding:0 24px;max-width:1100px;width:100%;margin:0 auto;flex:none;border-bottom:1px solid var(--soft)}
.stab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--ink-2)}
.stab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.stab .n{margin-left:6px;padding:0 7px;border-radius:9px;background:var(--navy);color:#fff;font-size:12.5px}
.sheet-b{flex:1;overflow:auto;padding:16px 24px 28px;max-width:1100px;width:100%;margin:0 auto}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:28px}
.sheet-b h3{font-size:21px;margin-bottom:8px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;color:var(--ink-2)}
.meta dt{font-weight:600}.meta dd{margin:0;color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pdfbody{flex:1;display:flex;flex-direction:column}
.pdfbody iframe{flex:1;width:100%;border:0;background:#fff}

/* filas con edición en línea */
.irow{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft);min-height:56px}
.il{font-weight:600;color:var(--ink-2);font-size:14px}
.iv{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:6px 10px;margin-left:-10px;border-radius:8px;text-align:left;font-size:16px;font-weight:500}
.iv:hover{background:var(--bg)}
.ie{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp{min-height:42px;padding:8px 10px;border:0;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--blue)}
.ie .inp{flex:1 1 200px;max-width:320px}
textarea.inp{width:100%;min-height:80px;resize:vertical;box-shadow:inset 0 0 0 1.5px #C9D2DC}
.pencil{width:16px;height:16px;fill:none;stroke:var(--ink-2);stroke-width:2}
.hov{opacity:0;transition:opacity .15s}
.hw:hover .hov,.hw:focus-within .hov,.irow:hover .hov,.note:hover .hov,tr:hover .hov{opacity:1}
@media (hover:none){.hov{opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:5px 14px;border:0;border-radius:19px;background:#fff;box-shadow:inset 0 0 0 1.5px #C9D2DC;font-weight:600;display:inline-flex;align-items:center;gap:7px;--st:var(--navy);--on-st:#fff}
.chip[aria-checked="true"]{background:var(--st);color:var(--on-st);box-shadow:none}
.chip.st-ok{--st:var(--green);--on-st:#fff}
.chip.st-atencion{--st:var(--amber);--on-st:var(--ink)}
.chip.st-reemplazar,.chip.st-faltante{--st:var(--red);--on-st:#fff}
.chip.st-ok,.chip.st-atencion,.chip.st-reemplazar,.chip.st-faltante{box-shadow:inset 0 0 0 1.5px var(--st)}
.chip.st-ok[aria-checked="true"],.chip.st-atencion[aria-checked="true"],.chip.st-reemplazar[aria-checked="true"],.chip.st-faltante[aria-checked="true"]{box-shadow:none}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:2px 0 4px;max-width:340px}
.bar i{display:block;height:100%;background:var(--st)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#FBF1DC;border-radius:8px;padding:10px 14px;box-shadow:var(--shadow)}
.note{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--soft)}
.note.done{opacity:.62}
.note p{margin:4px 0 0;grid-column:1/3}
.tag{display:inline-block;padding:1px 9px;border-radius:5px;background:var(--bg);font-weight:600;font-size:13px;margin-right:8px}
.check{display:flex;gap:8px;align-items:center;margin:10px 0 12px}
.check input{width:20px;height:20px}
.f{display:block;font-weight:600;font-size:14px;margin-bottom:5px;color:var(--ink-2)}
.fld{margin-bottom:14px}
.logl{list-style:none;margin:0;padding:0}
.logl li{padding:9px 0;border-bottom:1px solid var(--soft)}
.logl time{color:var(--ink-2);font-size:13px;margin-right:8px}

/* filas de lista y tablas */
.tblwrap{overflow-x:auto;margin-top:16px}
.tbl{width:100%;border-collapse:collapse;min-width:820px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-2);font-size:13.5px;padding:12px;border-bottom:2px solid var(--soft);position:sticky;top:0;background:#fff}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--soft);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.empty{margin-top:16px;padding:24px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 16px}
.toolbar .inp{flex:1 1 260px;max-width:420px;box-shadow:inset 0 0 0 1.5px #C9D2DC}
.toolbar .inp:focus{box-shadow:inset 0 0 0 1.5px var(--blue)}
.chip.cat{--st:var(--navy)}

/* acceso */
.login{max-width:400px;margin:64px auto 0;padding:28px 28px 24px}
.login h1{font-size:38px}
.login p{margin:6px 0 18px;color:var(--ink-2)}
.login .inp{width:100%;font-size:18px;box-shadow:inset 0 0 0 1.5px #C9D2DC}
.login .inp:focus{box-shadow:inset 0 0 0 1.5px var(--blue)}
.err{color:var(--red);font-weight:600;min-height:22px;margin:0 0 8px}


/* catálogos */
.cat-grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start;margin-top:16px}
.catnav{padding:6px 0 10px;position:sticky;top:84px}
.gt{font:600 16px var(--f-head);color:var(--ink-2);padding:12px 18px 4px}
.ci{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 18px;background:none;border:0;font-weight:500}
.ci:hover{background:var(--bg)}
.ci[aria-current="true"]{background:#EAF0F8;box-shadow:inset 4px 0 0 var(--navy);font-weight:700;color:var(--navy)}
.ci .n{font:600 15px var(--f-head);color:var(--ink-2)}
.ci.off{opacity:.55}
.cpanel-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:18px 20px 10px}
.cpanel-h h2{font-size:30px;line-height:1.05}
.cform{margin:6px 20px 16px;padding:16px 18px 18px;border-radius:10px;background:#F4F7FB;box-shadow:var(--shadow)}
.cform h3{font-size:22px;margin-bottom:12px}
.cf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.cf-grid .full{grid-column:1/-1}
.cf-grid .inp{width:100%;box-shadow:inset 0 0 0 1.5px #C9D2DC}
.cf-grid .inp:focus{box-shadow:inset 0 0 0 1.5px var(--blue)}
.cprev{display:grid;place-items:center;background:#fff;border-radius:8px;box-shadow:var(--shadow);padding:6px}
.cprev svg{width:100%;max-width:210px;max-height:150px;height:auto}
.crow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 20px;border-top:1px solid var(--soft)}
.crow:hover{background:#F8FAFC}
.crow.editing{background:#EAF0F8}
.crow.off{opacity:.65}
.cnum{font:600 20px var(--f-head);color:var(--ink-2);text-align:center}
.cname{background:none;border:0;padding:2px 6px;margin-left:-6px;border-radius:6px;font-weight:600;font-size:16px;text-align:left}
.cname:hover{background:var(--bg)}
.cmeta{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--ink-2);font-size:13.5px}
.cctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ibtn{min-width:38px;height:38px;padding:0 10px;border:0;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1.5px #C9D2DC;color:var(--navy);font-weight:600}

function st(p,lid=S.lineId){
  const d=S.tooling[tkey(lid,p.id)]||{};

function derive(p,wear){if(!p.limit||wear==null||isNaN(wear))return null;const r=wear/p.limit;return r>=1?'reemplazar':r>=0.7?'atencion':'ok';}
function secSummary(sec,lid=S.lineId){
  const c={ok:0,atencion:0,reemplazar:0,faltante:0,notes:0,requested:0,worst:'ok'};
  sec.parts.forEach(p=>{const s=st(p,lid);c[s.status]++;c.notes+=openNotes(p.id,lid).length;if(s.requested)c.requested++;if(RANK[s.status]>RANK[c.worst])c.worst=s.status;});
  return c;
}
function lineSummary(lid){
  const c={ok:0,atencion:0,reemplazar:0,faltante:0,notes:0,requested:0,worst:'ok',parts:0,unseen:0};
  SECTIONS.forEach(sec=>{const m=secSummary(sec,lid);['ok','atencion','reemplazar','faltante','notes','requested'].forEach(k=>c[k]+=m[k]);c.parts+=sec.parts.length;if(RANK[m.worst]>RANK[c.worst])c.worst=m.worst;});
  if(S.user)c.unseen=S.alerts.filter(a=>a.lineId===lid&&!(a.seen&&a.seen[S.user.emp])).length;
  return c;
}
function pendingRows(scope){
  scope=scope||S.pendLine;
  const lids=scope==='todas'?LINES.map(l=>l.id):(LINEBY[scope]?[scope]:[]),rows=[];
  lids.forEach((lid,li)=>SECTIONS.forEach((sec,si)=>sec.parts.forEach(p=>{
    const s=st(p,lid),nn=openNotes(p.id,lid).length;
    if(s.status!=='ok'||s.requested||nn)rows.push({line:LINEBY[lid],lid,li,sec,si,p,s,nn});
  })));
  rows.sort((a,b)=>RANK[b.s.status]-RANK[a.s.status]||a.li-b.li||a.si-b.si||a.p.n-b.p.n);
  return rows;
}

const byOrder=(a,b)=>(a.order||0)-(b.order||0);
function buildCatalog(){
  Object.keys(PARTS).forEach(k=>delete PARTS[k]);Object.keys(SECBY).forEach(k=>delete SECBY[k]);
  SECTIONS=[];ALLSECS=[];LINES=[];Object.keys(LINEBY).forEach(k=>delete LINEBY[k]);
  S.cat.lines.slice().sort(byOrder).forEach(l=>{const r=Object.assign({},l,{active:l.active!==false});LINEBY[r.id]=r;if(r.active)LINES.push(r);});
  S.cat.sections.slice().sort(byOrder).forEach(sr=>{
    const sec=Object.assign({},sr,{parts:[],active:sr.active!==false});
    let n=0,axis=false;
    S.cat.parts.filter(p=>p.sec===sec.id).sort(byOrder).forEach(pr=>{
      const p=Object.assign({},pr,{w:Number(pr.w)||0,h:Number(pr.h)||30,limit:(pr.limit==null||pr.limit==='')?null:Number(pr.limit),active:pr.active!==false,axis:false,n:null});
      if(p.active){p.n=++n;if(p.type==='shaft'&&!axis){p.axis=true;axis=true;}sec.parts.push(p);}
      PARTS[p.id]=p;
    });
    SECBY[sec.id]=sec;ALLSECS.push(sec);
    if(sec.active)SECTIONS.push(sec);
  });
}

function shape(t,w,h){
  const x=w/2,y=h/2,b=15;
  const bore=`<path class="hid" d="M${-x} ${-b}H${x}M${-x} ${b}H${x}"/>`;
  switch(t){
    case 'shaft':{const c=8;return `<path class="body" d="M${-x} ${-y+c}L${-x+c} ${-y}H${x-c}L${x} ${-y+c}V${y-c}L${x-c} ${y}H${-x+c}L${-x} ${y-c}Z"/><path class="edge" d="M${-x+34} ${-y}V${y}M${x-34} ${-y}V${y}"/>`;}
    case 'roller':{const s=w*0.14,r=y*0.72;return `<path class="body" d="M${-x} ${-r}H${-x+s}V${-y}H${x-s}V${-r}H${x}V${r}H${x-s}V${y}H${-x+s}V${r}H${-x}Z"/><path class="edge" d="M${-x+s} ${-r}V${r}M${x-s} ${-r}V${r}"/>${bore}`;}
    case 'bearing':{const r=Math.min(w*0.28,y*0.13);return `<rect class="body" x="${-x}" y="${-y}" width="${w}" height="${h}" rx="2"/><path class="edge" d="M${-x} ${-y*0.62}H${x}M${-x} ${y*0.62}H${x}"/><circle class="edge" cx="0" cy="${-y*0.81}" r="${r}"/><circle class="edge" cx="0" cy="${y*0.81}" r="${r}"/>${bore}`;}
    case 'spacer':return `<rect class="body" x="${-x}" y="${-y}" width="${w}" height="${h}" rx="2"/>${bore}`;
    case 'nut':{const c=6;return `<path class="body" d="M${-x} ${-y+c}L${-x+5} ${-y}H${x-5}L${x} ${-y+c}V${y-c}L${x-5} ${y}H${-x+5}L${-x} ${y-c}Z"/><path class="edge" d="M${-x+w*0.28} ${-y}V${y}"/>${bore}`;}
    case 'plate':return `<rect class="body" x="${-x}" y="${-y}" width="${w}" height="${h}" rx="2"/><path class="hid" d="M${-x} ${-y*0.62}H${x}M${-x} ${y*0.62}H${x}"/>${bore}`;
    case 'sleeve':return `<rect class="body" x="${-x}" y="${-y}" width="${w*0.28}" height="${h}" rx="2"/><rect class="body" x="${-x+w*0.28}" y="${-y*0.8}" width="${w*0.72}" height="${h*0.8}" rx="2"/>${bore}`;
    case 'key':return `<rect class="body" x="${-x}" y="${-y}" width="${w}" height="${h}" rx="2"/><path class="edge" d="M${-x+6} 0H${x-6}"/>`;
    case 'bolt':{const hw=w*0.3;return `<path class="body" d="M${-x} ${-y+3}L${-x+3} ${-y}H${-x+hw-3}L${-x+hw} ${-y+3}V${y-3}L${-x+hw-3} ${y}H${-x+3}L${-x} ${y-3}Z"/><rect class="body" x="${-x+hw}" y="${-y*0.4}" width="${w-hw}" height="${y*0.8}"/><path class="edge" d="${(()=>{let d='';for(let t=-x+hw+8;t<x-2;t+=7)d+=`M${t} ${-y*0.4}V${y*0.4}`;return d;})()}"/>`;}
    case 'washer':return `<rect class="body" x="${-x}" y="${-y}" width="${w}" height="${h}" rx="1.5"/><path class="hid" d="M${-x} ${-y*0.4}H${x}M${-x} ${y*0.4}H${x}"/>`;
    case 'blade':return `<path class="body" d="M${-x} ${-y}H${x}V${y*0.7}L0 ${y}L${-x} ${y*0.7}Z"/>${bore}`;
  }
  return `<rect class="body" x="${-x}" y="${-y}" width="${w}" height="${h}"/>`;
}
function partThumb(p){
  const W=62,H=46,sh=p.type==='shaft',ww=sh?150:Math.max(8,Number(p.w)||30),hh=sh?30:Math.max(10,Number(p.h)||40);

  return `<svg class="pthumb" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false"><rect class="pthumb-bg" width="${W}" height="${H}" rx="8"/><g transform="translate(${W/2},${H/2}) scale(${k.toFixed(3)})">${shape(p.type,ww,hh)}</g></svg>`;
}
function wrapName(n){
  if(n.length<=16)return [n];
  const w=n.split(' ');if(w.length<2)return [n];
  let best=1,bd=1e9;
  for(let i=1;i<w.length;i++){const d=Math.abs(w.slice(0,i).join(' ').length-w.slice(i).join(' ').length);if(d<bd){bd=d;best=i;}}
  return [w.slice(0,best).join(' '),w.slice(best).join(' ')];
}

}

/* ============ DIBUJOS TÉCNICOS POR SECCIÓN ============
   Cada dibujo define "puntos" (hotspots). En Catálogos, cada pieza se ubica en un punto
   del dibujo de su sección. Para una sección nueva se agrega aquí su dibujo.          */
function chainSVG(x0,y0,x1,y1,n){
  let o='';const ang=Math.atan2(y1-y0,x1-x0)*180/Math.PI;
  for(let i=0;i<n;i++){const t=(i+.5)/n,x=(x0+(x1-x0)*t).toFixed(1),y=(y0+(y1-y0)*t+22*Math.sin(Math.PI*t)).toFixed(1);
    o+=`<ellipse class="body" cx="${x}" cy="${y}" rx="12" ry="${i%2?4.5:8}" transform="rotate(${ang.toFixed(0)} ${x} ${y})"/>`;}
  return o;
}

const mkTanques=(TX,TUBE,COLS,NAME)=>{
  const CY=170,TW=160,HEAD=392,ROW0=450,RH=105,NT=TX.length;
  let base=`<text class="tbt" x="60" y="12">Vista general, en el sentido del alambrón</text>`;

  TX.forEach(x=>{base+=`<rect class="bgs" x="${x+60}" y="22" width="24" height="63"/>`;});
  base+=`<rect class="strip" x="20" y="164" width="1260" height="12"/>`;
  const hot={};
  TX.forEach((x,i)=>{hot['t'+(i+1)]={label:'Tanque '+(i+1),bx:x+80,by:315,side:'down',ax:x+80,ay:265,draw:tank(x)};});
  const [tx0,tx1]=TUBE;
  hot.tubo={label:'Tubo entre tanques',bx:Math.round((tx0+tx1)/2),by:315,side:'down',ax:Math.round((tx0+tx1)/2),ay:193,
    draw:`<rect class="body" x="${tx0}" y="147" width="${tx1-tx0}" height="46" rx="6"/><rect class="body" x="${tx0-6}" y="138" width="10" height="64" rx="2"/><rect class="body" x="${tx1-4}" y="138" width="10" height="64" rx="2"/><path class="hid" d="M${tx0+4} 163H${tx1-4}M${tx0+4} 177H${tx1-4}"/>`};
  // matriz de componentes internos: filas = componente, columnas = tanque
  const ROWS=[['c','Cono de bronce'],['m','Malla de acero'],['p','Pieza angulada'],['a','Acople']];
  const icon={
    c:(cx,cy)=>{let h='';for(let i=0;i<3;i++){const x=-28+i*26,hh=(34-(18/88)*(x+44))*1;[0.66,0.22].forEach(f=>{[-1,1].forEach(sg=>{h+=`<circle class="hole" cx="${cx+x}" cy="${cy+sg*hh*f}" r="2.6"/>`;});});}
      return `<path class="body" d="M${cx-44} ${cy-34}L${cx+44} ${cy-16}V${cy+16}L${cx-44} ${cy+34}Z"/>${h}<path class="hid" d="M${cx-44} ${cy-6}H${cx+44}M${cx-44} ${cy+6}H${cx+44}"/>`;},
    m:(cx,cy)=>`<rect class="mesh" x="${cx-46}" y="${cy-38}" width="92" height="76" rx="3"/>`,
    p:(cx,cy)=>`<path class="body" d="M${cx-34} ${cy-28}L${cx+26} ${cy-14}V${cy+14}L${cx-34} ${cy+28}Z"/><path class="hid" d="M${cx-34} ${cy-6}H${cx+26}M${cx-34} ${cy+6}H${cx+26}"/>`,
    a:(cx,cy)=>`<rect class="body" x="${cx-32}" y="${cy-36}" width="12" height="72" rx="2"/><rect class="body" x="${cx-20}" y="${cy-24}" width="46" height="48" rx="2"/><path class="hid" d="M${cx-32} ${cy-6}H${cx+26}M${cx-32} ${cy+6}H${cx+26}"/>`
  };
  COLS.forEach((cx0,ti)=>{base+=`<text class="tbt" style="text-anchor:middle" x="${cx0+120}" y="${HEAD}">Tanque ${ti+1}</text>`;});
  ROWS.forEach(([k,label],ri)=>{
    const cy=ROW0+ri*RH;
    base+=`<text class="tbt" x="24" y="${cy+5}">${label}</text><path class="asm" d="M24 ${cy+RH/2}H1250" style="stroke-dasharray:2 5;opacity:.5"/>`;
    COLS.forEach((cx0,ti)=>{
      hot[k+(ti+1)]={label:`${label} T${ti+1}`,bx:cx0+22,by:cy,side:'right',ax:cx0+22,ay:cy,draw:icon[k](cx0+188,cy)};
    });
  });
  const order=[...TX.map((x,i)=>'t'+(i+1)),'tubo'];
  ROWS.forEach(([k])=>{for(let t=1;t<=NT;t++)order.push(k+t);});
  return {name:NAME,w:1300,h:880,vy:-10,base,top:'',order,hot};
 };

function leaderSVG(bx,by,ax,ay){

  return `<path class="lead" d="M${sx} ${sy}L${ax} ${ay}"/><circle class="leadDot" cx="${ax}" cy="${ay}" r="3"/>`;
}
function balloonSVG(p,bx,by,side,s,nn,sel){
  const lines=wrapName(p.name).map(t=>[t,'']);if(s.requested)lines.push(['En pedido','ped']);

  lines.forEach((l,i)=>{
    if(side==='up')txt+=`<text class="lbl ${l[1]}" x="0" y="${-25-(L-1-i)*19}">${esc(l[0])}</text>`;
    else if(side==='down')txt+=`<text class="lbl ${l[1]}" x="0" y="${40+i*19}">${esc(l[0])}</text>`;

function customSVG(sec){

function explodedSVG(sec){
  const GAP=64,SC=1.5,M=90,H=540,AY=265,OFF=150;
  const row=sec.parts.filter(p=>!p.axis),axisP=sec.parts.find(p=>p.axis);
  let x=M+60;const pos={};
  row.forEach(p=>{const w=p.w*SC;pos[p.id]={cx:x+w/2,w};x+=w+GAP;});
  const shaftL=M,shaftR=x-GAP+60,total=shaftR+M,W=Math.max(900,total),ox=(W-total)/2;
  let parts='',leaders='',bals='';
  const place=(p,cx,w,side,bx)=>{
    cx+=ox;bx=bx==null?cx:bx;
    const by=side==='up'?AY-OFF:AY+OFF,edge=side==='up'?AY-p.h/2:AY+p.h/2;
    const s=st(p),nn=openNotes(p.id).length,sel=S.partId===p.id;
    const w2=p.axis?shaftR-shaftL:w;
    parts+=`<g class="part st-${s.status}${s.status==='faltante'?' missing':''}${sel?' sel':''}" tabindex="0" role="button" data-act="selPart" data-id="${p.id}" aria-label="${p.n}. ${esc(p.name)}. ${STATUS[s.status]}" transform="translate(${cx},${AY})"><title>${esc(p.name)}, ${esc(p.spec)}</title>${shape(p.type,w2,p.h)}</g>`;
    leaders+=`<path class="lead" d="M${bx} ${side==='up'?by+15:by-15}V${edge}"/><circle class="leadDot" cx="${bx}" cy="${edge}" r="3"/>`;
    const lines=wrapName(p.name).map(t=>[t,'']);if(s.requested)lines.push(['En pedido','ped']);
    const L=lines.length;
    const txt=lines.map((l,i)=>{const y=side==='up'?-25-(L-1-i)*17:36+i*17;return `<text class="lbl ${l[1]}" x="0" y="${y}">${esc(l[0])}</text>`;}).join('');
    bals+=`<g class="bal st-${s.status}${sel?' sel':''}" data-act="selPart" data-id="${p.id}" transform="translate(${bx},${by})" aria-hidden="true"><circle class="bc" r="15"/><text class="bn" y="6">${p.n}</text><g transform="translate(11,11)"><circle class="bb" r="8"/><text class="bg" y="4">${GLYPH[s.status]}</text></g>${nn?`<g transform="translate(21,-13)"><rect x="0" y="-9" width="24" height="18" rx="4" class="nf"/><text class="nt" x="12" y="4.5">${nn}</text></g>`:''}${txt}</g>`;
  };
  if(axisP)place(axisP,(shaftL+shaftR)/2-ox,0,'down',shaftL+ox+34);
  row.forEach((p,k)=>place(p,pos[p.id].cx,pos[p.id].w,k%2===0?'up':'down'));
  return `<svg class="exp" viewBox="0 0 ${W} ${H}" role="group" aria-label="Ensamble explosionado de ${esc(sec.name)}">${defs()}
   ${parts}<path class="cl" d="M${shaftL+ox-30} ${AY}H${shaftR+ox+30}"/>${leaders}${bals}
   <g transform="translate(${W-250},${H-62})"><rect class="tb" width="230" height="46"/><path class="tb" d="M0 23H230"/><text class="tbt" x="10" y="17">${esc(sec.name)}</text><text class="tbs" x="10" y="38">Ensamble explosionado, sin escala</text></g></svg>`;
}

function planSVG(){
  const WK={coil:190,guides:170,stand:240,cut:180,brush:200,drive:220,align:230,guia:170,torre:200,humid:240,tubo:240,tanques:260,tubolargo:250,cortadora:200,circograph:230,etiquetadora:190,rod4:210,prebend:230,winder:200};
  const K=1.3,GAP=36,PAD=50,SC=0.8,cy=190,top=68,h=244,LOC0=top-6;
  const wrapN=(name,max)=>{const w=name.split(' '),ls=[''];w.forEach(t=>{const cur=ls[ls.length-1];if(!cur)ls[ls.length-1]=t;else if((cur+' '+t).length<=max)ls[ls.length-1]=cur+' '+t;else ls.push(t);});if(ls.length>3){ls[2]=ls.slice(2).join(' ');}return ls.slice(0,3);};
  // datos de cada bloque
  const items=SECTIONS.map(sec=>{
    const sm=secSummary(sec),lines=[];
    if(sm.reemplazar)lines.push(['reemplazar',`${sm.reemplazar} por reemplazar`]);
    if(sm.faltante)lines.push(['faltante',`${sm.faltante} ${sm.faltante>1?'faltan':'falta'} en línea`]);
    if(sm.atencion)lines.push(['atencion',`${sm.atencion} con atención`]);
    if(sm.notes)lines.push(['nota',`${sm.notes} ${sm.notes>1?'notas abiertas':'nota abierta'}`,'nota']);
    if(!lines.length)lines.push(['ok','Todo en buen estado']);
    const lw=WK[sec.kind]||190,nl=wrapN(sec.name,Math.max(11,Math.floor(lw/13.5)));
    const metaY=top+h+32+(nl.length-1)*28+22,linesY=metaY+27,bottom=linesY+(lines.length-1)*21+10;
    return {sec,sm,lines,lw,bw:lw*K,nl,metaY,linesY,bottom};
  });
  // una sola fila continua en horizontal
  const W=Math.round(PAD*2+items.reduce((n,i)=>n+i.bw,0)+GAP*Math.max(0,items.length-1)+70);
  const rows=[];let cur=[],used=0;const cap=1e9;
  items.forEach(it=>{if(cur.length&&used+it.bw+GAP>cap){rows.push(cur);cur=[];used=0;}cur.push(it);used+=it.bw+(cur.length>1?GAP:0);if(cur.length===1)used=it.bw;});
  if(cur.length)rows.push(cur);
  let Y=70;const rowMeta=rows.map((r,ri)=>{const bot=Math.max(...r.map(i=>i.bottom));const hh=(bot-LOC0)*K;const m={Y,hh,sy:Y+(cy-LOC0)*K};Y+=hh+44;return m;});
  const H=Y+10;
  const strip='fill="var(--steel-mid)" stroke="var(--ink-2)" stroke-width="1"';
  let o=`<svg class="plan wide" viewBox="0 0 ${W} ${H}" style="width:${Math.round(W*SC)}px" role="group" aria-label="Layout de la línea, vista en planta">${defs()}
   <text class="flow" x="${PAD}" y="42" style="font-size:22px">Sentido del material, de izquierda a derecha</text>`;
  const geo=rows.map((r,ri)=>{
    const rev=ri%2===1;let x=PAD;const pos=r.map(it=>{const p=x;x+=it.bw+GAP;return p;});
    const xs=r.map((it,i)=>rev?W-pos[i]-it.bw:pos[i]);
    const last=ri===rows.length-1,y=rowMeta[ri].sy;
    const startX=rev?W-PAD+30:PAD-30;
    const endX=last?(rev?Math.min(...xs)-60:Math.max(...xs.map((v,i)=>v+r[i].bw))+60):(rev?PAD-30:W-PAD+30);
    return {r,rev,xs,y,startX,endX,last};
  });
  // tiras y conectores
  geo.forEach((g,ri)=>{
    const x0=Math.min(g.startX,g.endX),x1=Math.max(g.startX,g.endX);
    o+=`<rect class="strip" x="${x0}" y="${g.y-7}" width="${x1-x0}" height="14"/>`;
    const dir=g.rev?-1:1,ax=g.endX;
    if(g.last)o+=`<path d="M${ax} ${g.y-18}L${ax+dir*28} ${g.y}L${ax} ${g.y+18}Z" ${strip}/>`;
    else{const n=geo[ri+1],ye=n.y,bulge=g.rev?-60:60;
      o+=`<path d="M${ax} ${g.y}C${ax+bulge} ${g.y} ${ax+bulge} ${ye} ${ax} ${ye}" fill="none" stroke="var(--ink-2)" stroke-width="16"/><path d="M${ax} ${g.y}C${ax+bulge} ${g.y} ${ax+bulge} ${ye} ${ax} ${ye}" fill="none" stroke="var(--steel-mid)" stroke-width="14"/>`;}
  });
  // bloques
  geo.forEach((g,ri)=>g.r.forEach((it,i)=>{
    const {sec,sm,lines,lw,nl,metaY,linesY}=it,seq=geo.slice(0,ri).reduce((n,gg)=>n+gg.r.length,0)+i+1,b={x:0,w:lw},bx=g.xs[i],Y0=rowMeta[ri].Y;
    const label=`Sección ${seq}, ${sec.name}: ${sec.parts.length} piezas. ${lines.map(l=>l[1]).join(', ')}`;
    o+=`<g class="sec st-${sm.worst}" tabindex="0" role="button" data-act="openSection" data-id="${sec.id}" aria-label="${esc(label)}" transform="translate(${bx.toFixed(1)},${(Y0-LOC0*K).toFixed(1)}) scale(${K})">
      <rect class="hit" x="-6" y="${top-6}" width="${lw+12}" height="${it.bottom-top+12}"/>
      <rect class="frame" x="0" y="${top}" width="${lw}" height="${h}" rx="10"/>
      <rect class="strip" x="0" y="${cy-6}" width="${lw}" height="12"/>
      ${planIcon(sec.kind,b,cy)}
      <text class="sid" x="14" y="${top+28}" style="font-size:26px">${seq}</text>
      ${sm.worst!=='ok'?`<g transform="translate(${lw-24},${top+20})"><circle class="sbadge" r="13"/><text class="sbadge-t" y="5.5">${GLYPH[sm.worst]}</text></g>`:''}
      ${sm.faltante?`<g transform="translate(${lw-46},${top+h-46})"><rect class="ghostbox" width="32" height="32" rx="4"/><text class="ghostq" x="16" y="22">?</text></g>`:''}
      ${nl.map((t,j)=>`<text class="sname" x="0" y="${top+h+32+j*28}">${esc(t)}</text>`).join('')}
      <text class="smeta" x="0" y="${metaY}">${sec.parts.length} ${sec.parts.length===1?'pieza':'piezas'}</text>
      ${lines.map((l,j)=>`<g class="st-${l[0]}"><circle class="sdot" cx="5" cy="${linesY-5+j*21}" r="5" ${l[2]==='nota'?'style="fill:var(--navy)"':''}/><text class="sline" x="18" y="${linesY+j*21}">${esc(l[1])}</text></g>`).join('')}
    </g>`;
  }));
  return o+'</svg>';
}

function mmUpdate(){
  const c=$('#planCanvas'),w=$('#mmWin'),strip=$('#mmStrip');if(!c||!w||!strip)return;
  const cr=c.getBoundingClientRect();let f=-1,l=-1;
  c.querySelectorAll('g.sec').forEach((g,i)=>{const r=g.getBoundingClientRect();if(r.right>cr.left+12&&r.left<cr.right-12){if(f<0)f=i;l=i;}});

function planSVG2(){

    const sm=secSummary(sec),lines=[];
    if(sm.reemplazar)lines.push(['reemplazar',`${sm.reemplazar} por reemplazar`]);
    if(sm.faltante)lines.push(['faltante',`${sm.faltante} ${sm.faltante>1?'faltan':'falta'} en línea`]);

    if(sm.notes)lines.push(['nota',`${sm.notes} ${sm.notes>1?'notas abiertas':'nota abierta'}`]);
    if(!lines.length)lines.push(['ok','Todo en buen estado']);
    const lw=WK[sec.kind]||190,nl=(()=>{const max=Math.max(11,Math.floor(lw/13.5)),ls=[''];sec.name.split(' ').forEach(t=>{const c=ls[ls.length-1];if(!c)ls[ls.length-1]=t;else if((c+' '+t).length<=max)ls[ls.length-1]=c+' '+t;else ls.push(t);});if(ls.length>3)ls[2]=ls.slice(2).join(' ');return ls.slice(0,3);})();
    const nameY=352,metaY=nameY+(nl.length-1)*32+26,linesY=metaY+30,bottom=linesY+(lines.length-1)*22+14;
    const it={sec,sm,lines,lw,nl,x,i,nameY,metaY,linesY,bottom};x+=lw+GAP;return it;
  });

   <path d="M${W-20} ${cy-20}L${W+6} ${cy}L${W-20} ${cy+20}Z" fill="var(--steel-mid)" stroke="var(--ink-2)"/>`;
  items.slice(0,-1).forEach(it=>{const gx=it.x+it.lw+GAP/2;o+=`<line class="sepl" x1="${gx}" y1="${LT+14}" x2="${gx}" y2="${cy-28}"/><line class="sepl" x1="${gx}" y1="${cy+28}" x2="${gx}" y2="${LB-16}"/><path class="chev" d="M${gx-8} ${cy-11}L${gx+8} ${cy}L${gx-8} ${cy+11}Z"/>`;});
  items.forEach(it=>{
    const {sec,sm,lines,lw,nl,nameY,metaY,linesY,bottom}=it,dim=!secMatches(sec);
    const label=`Sección ${it.i+1}, ${sec.name}: ${sec.parts.length} piezas. ${lines.map(l=>l[1]).join(', ')}`;
    const n=sec.parts.length;
    o+=`<g class="sec st st-${sm.worst}${dim?' dim':''}" tabindex="0" role="button" data-act="openSection" data-id="${sec.id}" aria-label="${esc(label)}" transform="translate(${it.x},0)">
      <rect class="hit" x="${-GAP/2}" y="0" width="${lw+GAP}" height="${bottom}"/>
      <rect class="spot" x="-14" y="${LT+8}" width="${lw+28}" height="${LB-LT-16}" rx="16"/>
      <rect class="rib" x="${-GAP/2}" y="${LB-9}" width="${lw+GAP}" height="9"/>
      <g class="lift">${planIcon(sec.kind,{x:0,w:lw},cy)}</g>
      <circle class="nb" cx="24" cy="38" r="23"/><text class="nbt" x="24" y="47">${it.i+1}</text>
      <g transform="translate(${lw-10},38)">${sm.worst!=='ok'?'<circle class="halo" r="11"/>':''}<circle class="lamp" r="12"/><text class="lg" y="5">${GLYPH[sm.worst]}</text></g>
      ${sm.faltante?`<g transform="translate(${lw-46},${LB-62})"><rect class="ghostbox" width="34" height="34" rx="4"/><text class="ghostq" x="17" y="24">?</text></g>`:''}
      ${nl.map((t,j)=>`<text class="name2" x="0" y="${nameY+j*32}">${esc(t)}</text>`).join('')}

    </g>`;
  });

async function addAlert(kind,text,partId){

/* ============ CÓDIGO QR ============
   Usa la librería qrcode-generator (MIT, kazuhikoarase) desde cdnjs; requiere internet.
   Si no carga (por ejemplo, red de planta sin salida a internet), se muestra el enlace
   en texto para copiarlo o escribirlo a mano.                                        */
let qrLibState='idle';
function loadQrLib(cb){
  if(window.qrcode){cb(true);return;}
  if(qrLibState==='idle'){
    qrLibState='loading';qrLibLoaders=[];
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    s.onload=()=>{qrLibState='ready';qrLibLoaders.forEach(f=>f(true));qrLibLoaders=[];};
    s.onerror=()=>{qrLibState='error';qrLibLoaders.forEach(f=>f(false));qrLibLoaders=[];};
    document.head.appendChild(s);
  }
  if(qrLibState==='ready'){cb(true);return;}
  if(qrLibState==='error'){cb(false);return;}
  qrLibLoaders.push(cb);
}
var qrLibLoaders=[];
function qrUrl(){return location.origin+location.pathname+location.search+'#/'+encodeURIComponent(S.lineId)+'/'+encodeURIComponent(S.secId);}
function qrSvg(text){
  const q=window.qrcode(0,'M');q.addData(text);q.make();
  return q.createSvgTag({scalable:true});
}
function qrSheetHTML(){
  const sec=SECBY[S.secId],url=qrUrl();
  return `<div class="grip"></div><div class="sheet-h"><div><h2>Código QR</h2><span class="code">${esc(lineName(S.lineId))}, ${esc(sec.name)}</span></div><span class="sp"></span><button class="xbtn" data-act="closeQr" aria-label="Cerrar código QR">×</button></div>
   <div class="qr-body">
    <p class="small">Pégalo en la máquina. Al escanearlo con el celular se abre directo en esta sección, con sus piezas y sus dibujos en PDF.</p>
    <div class="qr-box" id="qrBox"><span class="small">Generando…</span></div>
    <div class="qr-url"><input class="inp" readonly value="${esc(url)}" onclick="this.select()" aria-label="Enlace de la sección"><button class="btn sm" data-act="qrCopy">Copiar</button></div>
    <div class="actions"><button class="btn primary" data-act="qrPrint">Imprimir</button><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Abrir enlace</a></div>
   </div>`;
}
function renderQr(){
  const el=$('#qrSheet');
  if(!S.qr){el.classList.remove('open');return;}
  el.innerHTML=qrSheetHTML();
  if(!el.classList.contains('open'))requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('open')));
  const box=$('#qrBox'),sec=SECBY[S.secId],url=qrUrl();
  loadQrLib(ok=>{
    if(!box||!document.body.contains(box))return;
    if(!ok){box.innerHTML='<p class="qr-fallback">No se pudo cargar el generador de código QR (revisa la conexión a internet). Copia el enlace de abajo o escríbelo a mano.</p>';return;}
    try{
      const svg=qrSvg(url);box.innerHTML=svg;
      const print=$('#qrPrint');if(print)print.innerHTML=`${svg}<h2>${esc(sec.name)}</h2><p>${esc(lineName(S.lineId))} · Tooling Control</p>`;
    }catch(e){box.innerHTML='<p class="qr-fallback">No se pudo generar el código. Copia el enlace de abajo.</p>';}
  });
}
async function stockWrite(partId,qty,prevForLog){
  const rec={partId,qty,updatedAt:Date.now(),updatedBy:who()};
  S.stock[partId]=rec;render();
  if(S.caps.db){try{await S.caps.db.doc('stock/'+partId).set(rec);}catch(e){toast('No se pudo guardar la existencia.');return false;}}
  const p=PARTS[partId];
  await addLog('stock_edicion',`Existencia de ${p?p.name:partId}: ${prevForLog==null?'sin registrar':prevForLog} a ${qty}.`,partId,p?p.sec:null);
  return true;
}
async function stockBump(partId,dir){
  const cur=stockOf(partId),next=Math.max(0,(cur||0)+dir);
  if(cur===next)return;
  await stockWrite(partId,next,cur);
}
async function stockSave(){
  const e=S.stockEdit;if(!e)return;
  const n=parseInt(e.v,10);
  if(isNaN(n)||n<0){toast('Escribe una cantidad válida (0 o más).');return;}
  const cur=stockOf(e.id);S.stockEdit=null;
  if(await stockWrite(e.id,n,cur))toast('Existencia guardada.');
}
async function saveTooling(id,patch){
  const key=tkey(S.lineId,id),cur=S.tooling[key]||{};
  const next=Object.assign({status:'ok',wear:null,installed:null,measuredAt:null,measuredBy:null,requested:null,serial:1},cur,patch,{lineId:S.lineId,partId:id});
  S.tooling[key]=next;render();
  if(S.caps.db){try{await S.caps.db.doc('tooling/'+key).set(next);}catch(e){toast('No se pudo guardar. Inténtalo de nuevo.');}}
}
const stamp=()=>({measuredAt:Date.now(),measuredBy:who()});
async function changeStatus(id,to,extraLog){
  const p=PARTS[id],from=st(p).status;
  if(from===to)return;
  await saveTooling(id,Object.assign({status:to},stamp()));
  await addLog('estado',`${STATUS[from]} a ${STATUS[to]}${extraLog?'. '+extraLog:''}`,id);
  if(to!=='ok')await addAlert('estado',`${p.code} ${p.name} pasó a ${STATUS[to]}.`,id);
}
async function commitField(){
  const e=S.edit;if(!e||!S.partId)return;
  const p=PARTS[S.partId],id=p.id;
  if(e.f==='installed'){
    const v=e.v.trim();S.edit=null;
    await saveTooling(id,Object.assign({installed:v||null},stamp()));
    await addLog('medida',`Medida instalada: ${v||'sin registrar (vuelve a la de catálogo)'}`,id);
    toast('Medida guardada.');
  }else if(e.f==='wear'){
    const w=parseFloat(e.v);
    if(isNaN(w)||w<0){toast('Escribe un desgaste válido en mm.');return;}
    S.edit=null;
    const cur=st(p).status,d=derive(p,w),next=cur==='faltante'?cur:(d||cur);
    await saveTooling(id,Object.assign({wear:w},stamp()));

async function doConfirm(){

    await addAlert('repos',`Reposición solicitada: ${p.code} ${p.name}.`,id);

async function onPdf(file){
  if(!file||!S.partId)return;
  const p=PARTS[S.partId];
  if(!/pdf$/i.test(file.type)&&!/\.pdf$/i.test(file.name)){toast('El archivo debe ser un PDF.');return;}
  if(!S.caps.db){S.drawings[p.id]={url:URL.createObjectURL(file),filename:file.name,at:Date.now(),by:who()};await addLog('dibujo',file.name,p.id);render();toast('Dibujo cargado en modo de prueba.');return;}
  if(!S.caps.assets){toast('Solo los editores pueden cargar dibujos.');return;}
  toast('Subiendo dibujo…');

    const r=await S.caps.assets.upload(file,{type:'application/pdf'});

    if(!name)return err('Escribe el nombre de la pieza.');
    if(!code)return err('Escribe el código del dibujo.');
    if(S.cat.parts.some(p=>p.id!==f.id&&norm(p.code)===norm(code)))return err('Ese código ya lo usa otra pieza.');
    const w=sh?0:Number(v.w),h=sh?30:Number(v.h);
    if(!sh&&!(w>=8&&w<=120&&h>=10&&h<=170))return err('El tamaño en el dibujo debe estar entre 8 y 120 de grosor y entre 10 y 170 de alto.');
    const lim=String(v.limit).trim()===''?null:Number(v.limit);
    if(lim!==null&&(isNaN(lim)||lim<0))return err('El límite de desgaste debe ser un número en mm.');
    if(sh&&S.cat.parts.some(p=>p.sec===sec&&p.id!==f.id&&p.type==='shaft'&&p.active!==false))return err('Esta sección ya tiene un eje. Solo se permite uno por sección.');
    if(v.hot&&S.cat.parts.some(p=>p.sec===sec&&p.id!==f.id&&p.active!==false&&p.hot===v.hot))return err('Esa ubicación del dibujo ya la ocupa otra pieza.');
    rec=Object.assign({},old||{id:f.newId,sec,order:nextOrder(S.cat.parts.filter(p=>p.sec===sec)),active:true},{hot:v.hot||'',name,code,type:v.type,spec:v.spec.trim(),mat:v.mat.trim(),limit:lim,w,h});
  }else if(ent==='line'){
    const name=v.name.trim();
    if(!name)return err('Escribe el nombre de la línea.');
    if(S.cat.lines.some(l=>l.id!==f.id&&norm(l.name)===norm(name)))return err('Ya existe una línea con ese nombre.');
    rec=Object.assign({},old||{id:f.newId,order:nextOrder(S.cat.lines),active:true},{name});
  }else{
    const label=v.label.trim();
    if(!label)return err('Escribe el nombre del tipo de problema.');
    if(S.cat.kinds.some(k=>k.id!==f.id&&norm(k.label)===norm(label)))return err('Ya existe un tipo con ese nombre.');
    rec=Object.assign({},old||{id:f.newId,order:nextOrder(S.cat.kinds),active:true},{label});
  }
  let text='';
  if(old){text=diffText(ent,old,rec);if(!text){S.cf=null;render();toast('No hay cambios que guardar.');return;}}
  const before=old?Object.assign({},old):null;
  S.cf=null;
  if(await catPut(ent,rec)){
    if(before)await logCat('catalogo_edicion',ent,rec,text);
    else await logCat('catalogo_alta',ent,rec,ent==='part'?`Código ${rec.code} en la sección ${SECBY[rec.sec]?SECBY[rec.sec].name:rec.sec}.`:'Agregado al catálogo.');
    toast(before?'Cambios guardados.':'Agregado al catálogo.');
  }else{S.cf=f;render();}
}
async function renameOk(){
  const r=S.ren;if(!r)return;
  const rec=recOf(r.ent,r.id),key=r.ent==='kind'?'label':'name',v=r.v.trim();
  if(!v){toast('El nombre no puede quedar vacío.');return;}
  if(v===rec[key]){S.ren=null;render();return;}
  const dup=(r.ent==='section'||r.ent==='kind'||r.ent==='line')&&S.cat[collOf[r.ent]].some(x=>x.id!==rec.id&&String(entName(r.ent,x)).trim().toLowerCase()===v.toLowerCase());
  if(dup){toast('Ya existe un elemento con ese nombre.');return;}
  const nx=Object.assign({},rec,{[key]:v}),oldName=rec[key];
  S.ren=null;
  if(await catPut(r.ent,nx)){await logCat('catalogo_edicion',r.ent,nx,`Nombre: ${oldName} a ${v}`);toast('Nombre actualizado.');}
}
async function moveCat(ent,id,dir){
  const it=catItems(),act=it.all.filter(r=>r.active!==false);
  const i=act.findIndex(r=>r.id===id),j=i+dir;
  if(i<0||j<0||j>=act.length)return;
  const arr=act.slice();[arr[i],arr[j]]=[arr[j],arr[i]];
  const changed=[];
  arr.forEach((r,k)=>{const rec=recOf(ent,r.id);if(rec.order!==k+1){rec.order=k+1;changed.push(rec);}});
  render();
  if(S.caps.db){for(const rec of changed){try{await S.caps.db.doc(collOf[ent]+'/'+rec.id).set(rec);}catch(e){toast('No se pudo cambiar el orden.');break;}}}
}
async function setActive(ent,id,active){
  const rec=recOf(ent,id);if(!rec)return;
  S.catConf=null;
  if(!active&&ent==='kind'&&activeKinds().length<=1){toast('Debe quedar al menos un tipo de problema activo.');render();return;}
  if(active&&ent==='part'&&rec.type==='shaft'&&S.cat.parts.some(p=>p.sec===rec.sec&&p.id!==rec.id&&p.type==='shaft'&&p.active!==false)){toast('Esa sección ya tiene un eje activo.');return;}
  const nx=Object.assign({},rec,{active});
  if(await catPut(ent,nx)){await logCat(active?'catalogo_reactivacion':'catalogo_baja',ent,nx,active?'Reactivado.':'Dado de baja. El historial se conserva.');toast(active?'Reactivado.':'Dado de baja.');}
}

function stockOf(partId){const r=S.stock[partId];return r&&r.qty!=null?r.qty:null;}
function allCatParts(){const arr=[];ALLSECS.forEach(sec=>{if(!sec.active)return;S.cat.parts.filter(p=>p.sec===sec.id&&p.active!==false).sort(byOrder).forEach(p=>arr.push({p,sec}));});return arr;}
function stockRows(){
  const q=S.stockQ.trim().toLowerCase();
  return allCatParts().filter(({p,sec})=>{
    const n=stockOf(p.id);
    if(S.stockOnly&&n)return false;
    if(!q)return true;
    return (p.name+' '+p.code+' '+sec.name).toLowerCase().includes(q);
  });
}
function stockPill(n){
  if(n==null)return `<span class="pill stk-pill unk plain">Sin registrar</span>`;

  return `<span class="pill stk-pill plain">${n} en almacén</span>`;
}

   <button type="button" class="chip cat" aria-checked="${S.stockOnly}" data-act="stockOnly">Solo sin existencia</button></div>
   ${rows.length?`<div class="tblwrap" style="margin-top:0"><table class="tbl"><thead><tr><th>Pieza</th><th>Número de parte</th><th>Sección</th><th>Existencia</th><th></th></tr></thead><tbody>${rows.map(({p,sec})=>{

   :'<p class="small" style="padding:16px 18px;margin:0">No hay piezas que coincidan con la búsqueda.</p>'}</div>`;

function parseDeepLink(){

function applyDeepLink(){

  if(!LINEBY[dl.lineId]||!SECBY[dl.secId]){toast('El código QR apunta a una sección que ya no existe o está dada de baja.');S.qrDone=true;return;}
  S.qrDone=true;S.lineId=dl.lineId;persistLine();S.view='section';S.secId=dl.secId;S.partId=null;
  try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}
}

async function doLogin(){
  const emp=S.login.emp.trim(),pin=S.login.pin,err=m=>{S.login.err=m;const e=$('#lg-err');if(e)e.textContent=m;};
  if(Date.now()<S.lockUntil){err('Demasiados intentos. Espera unos segundos e inténtalo de nuevo.');return;}
  if(!/^\d{3,10}$/.test(emp)||!/^\d{4}$/.test(pin)){err('Escribe tu número de empleado y un PIN de 4 dígitos.');return;}
  let u=null;try{u=await EmployeeDirectory.verify(emp,pin);}catch(_){err('No se pudo consultar el catálogo de empleados.');return;}
  if(!u){S.fails++;if(S.fails>=5){S.lockUntil=Date.now()+30000;S.fails=0;}S.login.pin='';err('Número de empleado o PIN incorrecto.');const p=$('#lg-pin');if(p){p.value='';p.focus();}return;}
  S.user=u;S.fails=0;S.login={emp:'',pin:'',err:''};S.view='home';
  try{sessionStorage.setItem('tc_emp',u.emp);}catch(_){}
  $('#main').innerHTML='';render();window.scrollTo(0,0);
}

  if(e.key==='Escape'){
    if(t.id==='q'){S.q='';t.value='';renderResults();return;}

    if(S.pdf){S.pdf=false;renderPdf();return;}

    if(S.catConf){S.catConf=null;render();return;}

    db.collection('tooling').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.tooling=m;render();},err);
    db.collection('notes').onSnapshot(s=>{S.notes=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.at||0)-(b.at||0));render();},err);
    db.collection('drawings').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.drawings=m;render();},err);
    ['lines','sections','parts','kinds'].forEach(coll=>db.collection(coll).onSnapshot(s=>{
      if(s.size>0){S.cat[coll]=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.cat.empty[coll]=false;}
      else{S.cat[coll]=clone(DEFAULT_CAT[coll]);S.cat.empty[coll]=true;}
      S.cat.ready[coll]=true;render();
    },err));
    db.collection('alerts').orderBy('at','desc').limit(200).onSnapshot(s=>{S.alerts=s.docs.map(d=>Object.assign({id:d.id},d.data()));render();},err);
    db.collection('log').orderBy('at','desc').limit(800).onSnapshot(s=>{S.log=s.docs.map(d=>Object.assign({id:d.id},d.data()));render();},err);
    db.collection('stock').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.stock=m;render();},err);
  }else{S.local=true;}
  try{const l=sessionStorage.getItem('tc_line');if(l)S.lineId=l;}catch(_){}
  try{const e=sessionStorage.getItem('tc_emp');if(e){const u=await EmployeeDirectory.get(e);if(u)S.user=u;}}catch(_){}
  render();
})();
</script>
</body>
</html>
